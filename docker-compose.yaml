services:
  db:
    image: postgres:18.6
    container_name: app_postgres
    env_file: 
      - .env.docker
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB:-simple_fastapi_app}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DB:-simple_fastapi_app}"]
      interval: 5s
      timeout: 5s
      retries: 3
  
  redis:
    image: redis:8.10
    container_name: app_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  migrations:
    build: .
    entrypoint: alembic upgrade head
    command: []
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
  
  backend:
    build: .
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  pg_data:
  redis_data:
